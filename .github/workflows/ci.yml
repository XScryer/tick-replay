name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Smoke test (synthetic data end-to-end)
        run: |
          python examples/synthetic_ticks.py --days 30 --ticks-per-day 20000 --out /tmp/SYNTH/raw
          python -m tickreplay.data csv2bin --raw-dir /tmp/SYNTH/raw --symbol SYNTH --bin-dir /tmp/SYNTH/bin
          python -m tickreplay.data audit --bin-dir /tmp/SYNTH/bin
          python examples/eurusd_wick_fade.py --bin-dir /tmp/SYNTH/bin --from 2024-01-08 --to 2024-01-31 --preset wick_fade --out /tmp/trades.csv
