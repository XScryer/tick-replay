[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tick-replay"
version = "0.1.0"
description = "Real tick data (cTrader Open API) + tick-level backtesting engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
ctrader = ["ctrader-open-api>=0.9", "twisted>=22.0"]

[tool.setuptools.packages.find]
include = ["tickreplay*"]
