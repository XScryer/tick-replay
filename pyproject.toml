[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tick-replay"
version = "0.2.0"
description = "Real bid/ask tick data from the cTrader Open API + a tick-level backtesting engine"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "XScryer" }]
requires-python = ">=3.10"
keywords = ["backtesting", "tick-data", "forex", "ctrader", "trading"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
# the downloader only; the engine works without it
ctrader = ["ctrader-open-api>=0.9.2", "twisted>=22.0", "service-identity>=21.1"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/XScryer/tick-replay"

[tool.setuptools.packages.find]
include = ["tickreplay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S110", "BLE"]
ignore = [
    "E701", "E702",   # compact one-line SL/TP branches in the engine loop
    "E741",           # `l` for bar lows is the conventional OHLC name
    "B905",           # zip(strict=) is noise for equal-length numpy slices
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
